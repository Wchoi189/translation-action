name: Translate README Example

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Translate README to Korean (Upstage)
        id: translate
        # Replace YOUR_USERNAME with your GitHub username
        # You can use: @main, @branch-name, @commit-sha, or @v1.0.0 (release tag)
        uses: YOUR_USERNAME/translation-action@main
        with:
          provider: upstage
          lang: en-ko
          source: README.md
          api_key: ${{ secrets.UPSTAGE_API_KEY }}
          api_additional_parameter: solar-pro2
      
      - name: Save translated README
        run: |
          echo "${{ steps.translate.outputs.text }}" > README.ko.md
      
      - name: Commit and push translation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.ko.md
          git diff --staged --quiet || git commit -m "Update Korean translation [skip ci]"
          git push

